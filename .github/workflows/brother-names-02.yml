name: Render eight Brother-name auditions
on:
  push:
    branches: [brother-name-auditions-02]
    paths:
      - scripts/render_brother_names_02.py
      - .github/workflows/brother-names-02.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brother-names-02
  cancel-in-progress: false

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brother-name-auditions-02
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-d20.txt
      - name: Install audio and TTS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-d20.txt
      - name: Generate eight Brother voices
        run: python scripts/render_brother_names_02.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("auditions/brother-names-02")
          data=json.loads((p/"manifest.json").read_text())
          assert len(data["candidates"]) == 8
          assert [row["printed_name"] for row in data["candidates"]] == [
              "Brother Rubicon","Brother TheDie","Brother The Die",
              "Brother Thudiey","Brother Thudie","Brother The Dhai",
              "Brother Thadhai","Brother Berengar",
          ]
          assert all((p/row["filename"]).stat().st_size > 2000 for row in data["candidates"])
          assert (p/data["compilation_filename"]).stat().st_size > 10000
          print("Verified eight separate MP3s and the complete listening track.")
          PY
          ffprobe -v error -show_entries format=duration,size -of json auditions/brother-names-02/00-eight-brother-names-compilation.mp3
      - name: Store audition files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditions/brother-names-02/
          if ! git diff --cached --quiet; then
            git commit -m "Generate seven Brother-name audition MP3s"
            git pull --rebase origin brother-name-auditions-02
            git push origin HEAD:brother-name-auditions-02
          fi
      - name: Preserve audition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eight-Brother-name-auditions
          path: auditions/brother-names-02
          if-no-files-found: warn
