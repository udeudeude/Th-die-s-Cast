name: Generate wizard voice auditions
on:
  workflow_dispatch:
  push:
    branches: [wizard-voice-auditions]
    paths:
      - 'scripts/wizard_auditions.py'
      - '.github/workflows/wizard-auditions.yml'

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wizard-voice-auditions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-voices.txt
      - name: Install phonemizer support
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Install speech synthesizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-voices.txt
      - name: Render wizard voice auditions
        run: python scripts/wizard_auditions.py
      - name: Save audition audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditions/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Render four wizard voice auditions"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wizard-voice-auditions
          path: auditions/*.mp3
