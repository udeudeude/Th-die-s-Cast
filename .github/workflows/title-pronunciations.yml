name: Render Lewis title pronunciations
on:
  push:
    branches: [title-pronunciation-auditions]
    paths:
      - scripts/render_title_auditions.py
      - .github/workflows/title-pronunciations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pronounce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: title-pronunciation-auditions
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-d20.txt
      - name: Install phonemizer and encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Install Kokoro
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-d20.txt
      - name: Synthesize each pronunciation
        run: python scripts/render_title_auditions.py
      - name: Check all candidates
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('auditions/title')
          data=json.loads((p/'manifest.json').read_text())
          assert len(data['candidates'])==10
          for item in data['candidates']:
              assert (p/item['file']).stat().st_size > 1000
          assert (p/data['compilation_file']).stat().st_size > 1000
          print('Verified ten tracks and one complete compilation')
          PY
      - name: Commit audio audition files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditions/title
          if ! git diff --cached --quiet; then
            git commit -m "Render ten narrated title pronunciation auditions"
            git pull --rebase origin title-pronunciation-auditions
            git push origin HEAD:title-pronunciation-auditions
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lewis-title-pronunciation-auditions
          path: auditions/title
